version: '3.8'

services:
  querywise:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: querywise-app
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=postgres://querywise_user:querywise_secure_pass@postgres:5432/querywise_db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: querywise-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=querywise_user
      - POSTGRES_PASSWORD=querywise_secure_pass
      - POSTGRES_DB=querywise_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U querywise_user -d querywise_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:

