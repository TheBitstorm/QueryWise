version: 1.0
runtime: nodejs22
build:
  commands:
    build:
      - cd frontend && npm ci && npm run build
      - cd ../backend && npm ci --omit=dev
run:
  runtime-version: 22
  command: cd backend && node src/server.js
  network:
    port: 5000
    env: APP_PORT
  env:
    - name: NODE_ENV
      value: production
    - name: PORT
      value: "5000"

